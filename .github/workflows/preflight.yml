name: ColorOS 17 Stage-0 preflight

on:
  push:
    branches: [dev/coloros17-firstboot]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned sources and synthetic donor formats
        run: python3 -m unittest discover -s tests -v
