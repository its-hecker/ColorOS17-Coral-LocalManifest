name: ColorOS17 Pixel product/system_ext runtime inventory

on:
  push:
    branches: [dev/coloros17-firstboot]
    paths:
      - .github/workflows/pixel-runtime-audit.yml
      - tools/pixel_runtime_dependencies.py
      - sources.lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-dependency-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned original Pixel vendor
        run: python3 tools/bootstrap.py
      - name: Inventory device-specific product/system_ext dependencies
        run: python3 tools/pixel_runtime_dependencies.py
      - name: Upload JSON metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coral-pixel-runtime-dependencies
          path: work/pixel-runtime-deps.json
          if-no-files-found: ignore
          retention-days: 14
